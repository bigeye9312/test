name: Build and deploy Quartz from docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/playbooks/**'
      - 'docs/products/**'
      - 'docs/_quartz/*.py'
      - '.github/workflows/quartz-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out playbook repository
        uses: actions/checkout@v4
      - name: Fetch Quartz 4 inside docs
        run: git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git docs/_quartz/.engine
      - name: Prepare Quartz content
        run: python docs/_quartz/prepare_content.py
      - name: Configure Quartz
        run: python docs/_quartz/configure.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Quartz dependencies
        working-directory: docs/_quartz/.engine
        run: npm ci --no-audit --no-fund
      - name: Build Quartz
        working-directory: docs/_quartz/.engine
        run: npx quartz build
      - name: Store generated files inside docs
        run: |
          mkdir -p docs/_quartz/dist
          cp -a docs/_quartz/.engine/public/. docs/_quartz/dist/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_quartz/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
